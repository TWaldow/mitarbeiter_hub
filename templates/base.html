<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitarbeiter-Hub</title>
    <link rel="icon"
          type="image/x-icon"
          href="{{ url_for('static', filename='favicon.png') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet" />
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      :root {
        --primary-color: {{ store.primary_color }};
        --secondary-color: {{ store.secondary_color }};
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-cubes me-2 text-info"></i> Mitarbeiter-Hub
        </a>
        <div class="navbar-text text-light d-none d-md-block">
          <small><i class="fas fa-user-shield me-1"></i> Mitarbeiter-Bereich</small>
        </div>
      </div>
    </nav>
    {% if request.path.count('/') > 2 %}
      <div class="container mb-4">
        <a href="/service/{{ store_id }}"
           class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Zurück</a>
      </div>
    {% endif %}
    <div class="container maint-content">
      {% block content %}
      {% endblock %}
    </div>
    <footer class="footer mt-auto py-3 bg-light border-top text-center text-muted">
      <div class="container">
        <small>Mitarbeiter-Hub | Prototyp v0.2</small>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
